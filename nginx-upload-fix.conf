# Nginx configuration to fix 413 Request Entity Too Large error
# Add this to your Nginx server block (usually in /etc/nginx/sites-available/default or your site config)

# Increase client body size limit for large file uploads (qualification course intro files)
client_max_body_size 200M;

# Also increase buffer sizes for large requests
client_body_buffer_size 200M;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

# Increase timeouts for large file uploads
client_body_timeout 300s;
client_header_timeout 300s;
send_timeout 300s;

