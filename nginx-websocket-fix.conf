# Nginx Configuration Fix for Socket.IO WebSocket Connections
# Add this to your Nginx site configuration: /etc/nginx/sites-available/lms
# This fixes the 502 Bad Gateway error for WebSocket connections

# IMPORTANT: Add this location block BEFORE the general /api proxy block
# Socket.IO WebSocket proxy configuration
location /socket.io/ {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    
    # WebSocket upgrade headers (CRITICAL for WebSocket to work)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket-specific timeouts (long-lived connections)
    proxy_read_timeout 86400s;  # 24 hours
    proxy_send_timeout 86400s;  # 24 hours
    
    # Disable buffering for WebSocket
    proxy_buffering off;
    proxy_cache off;
    
    # Allow large WebSocket frames
    proxy_buffer_size 4k;
}

# Alternative: If you want to proxy all Socket.IO paths
# This is more permissive and handles all Socket.IO routes
location ~ ^/socket\.io {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    
    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket timeouts
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    
    # Disable buffering
    proxy_buffering off;
    proxy_cache off;
}

