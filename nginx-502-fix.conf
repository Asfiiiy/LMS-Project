# Nginx configuration to fix intermittent 502 Bad Gateway errors
# Add these settings to your location /api/ block in Nginx site config

# Connection and timeout settings for backend proxy
proxy_connect_timeout 60s;        # Time to establish connection with backend
proxy_send_timeout 600s;          # Time to send request to backend (10 minutes)
proxy_read_timeout 600s;          # Time to wait for backend response (10 minutes)

# Better error handling - retry on failure
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;      # Try up to 3 upstream servers
proxy_next_upstream_timeout 10s;  # Total time for retries

# Buffer settings to prevent 502s from slow responses
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;
proxy_temp_file_write_size 8k;

# Keep-alive connections to backend (reduces connection overhead)
proxy_http_version 1.1;
proxy_set_header Connection "";

# Standard proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Don't close connection if client disconnects (useful for long requests)
proxy_ignore_client_abort off;

